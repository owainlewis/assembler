name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            npm: bundled
            install_flags: ""
          - os: ubuntu-latest
            npm: 12.0.2
            install_flags: --strict-allow-scripts
          - os: macos-latest
            npm: 12.0.2
            install_flags: --strict-allow-scripts
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: matrix.npm != 'bundled'
        run: npm install --global npm@${{ matrix.npm }}
      - run: npm ci ${{ matrix.install_flags }}
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
